<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问卷系统 - 题目库</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="/dashboard.html" class="nav-brand">问卷系统</a>
    <div class="nav-actions">
      <a href="/dashboard.html" class="btn btn-outline btn-sm">问卷</a>
      <a href="/question-lib.html" class="btn btn-primary btn-sm">题目库</a>
      <a href="/question-bank.html" class="btn btn-outline btn-sm">题库</a>
      <span class="nav-user" id="navUser"></span>
      <button class="btn btn-outline btn-sm" id="logoutBtn">退出</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>题目库</h1>
      <div class="header-actions">
        <button class="btn btn-primary" id="createQuestionBtn">+ 创建题目</button>
      </div>
    </div>

    <div id="alert"></div>
    <div id="questionList" class="stack"></div>
    <div id="emptyTip" class="card text-center text-secondary hidden">
      还没有题目，点击上方按钮创建一个吧。
    </div>
  </div>

  <!-- 创建/编辑题目弹窗 -->
  <div id="questionModal" class="modal hidden">
    <div class="modal-panel">
      <h2 id="modalTitle" class="modal-title">创建题目</h2>
      <form id="questionForm">
        <div class="form-group">
          <label for="qTitle">题目标题</label>
          <input type="text" id="qTitle" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="qType">题目类型</label>
          <select id="qType" class="form-control">
            <option value="single_choice">单选题</option>
            <option value="multiple_choice">多选题</option>
            <option value="text_input">文本填空</option>
            <option value="number_input">数字填空</option>
          </select>
        </div>
        <div class="form-group checkbox-group">
          <input type="checkbox" id="qRequired">
          <label for="qRequired">必答题</label>
        </div>

        <div id="optionsArea">
          <div class="form-group">
            <label>选项</label>
            <div id="optionsList"></div>
            <button type="button" class="btn btn-outline btn-sm mt-2" id="addOptionBtn">+ 添加选项</button>
          </div>
        </div>

        <div id="validationArea"></div>

        <div id="jumpRulesArea">
          <div class="form-group">
            <label>跳转规则</label>
            <div id="jumpRulesList"></div>
            <button type="button" class="btn btn-outline btn-sm mt-2" id="addJumpRuleBtn">+ 添加跳转规则</button>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelQuestion">取消</button>
          <button type="submit" class="btn btn-primary" id="saveQuestionBtn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 共享弹窗 -->
  <div id="shareModal" class="modal hidden">
    <div class="modal-panel">
      <h2 class="modal-title">共享题目</h2>
      <div class="form-group">
        <label for="shareUsername">输入用户名</label>
        <input type="text" id="shareUsername" class="form-control" placeholder="要共享给的用户名">
      </div>
      <div id="shareAlert"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelShare">取消</button>
        <button type="button" class="btn btn-primary" id="confirmShare">共享</button>
      </div>
    </div>
  </div>

  <!-- 版本历史弹窗 -->
  <div id="versionsModal" class="modal hidden">
    <div class="modal-panel">
      <h2 class="modal-title">版本历史</h2>
      <div id="versionsList" class="stack"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="closeVersions">关闭</button>
      </div>
    </div>
  </div>

  <!-- 引用详情弹窗 -->
  <div id="surveysModal" class="modal hidden">
    <div class="modal-panel">
      <h2 class="modal-title">引用此题的问卷</h2>
      <div id="surveyRefsList" class="stack"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="closeSurveyRefs">关闭</button>
      </div>
    </div>
  </div>

  <!-- 跨问卷统计弹窗 -->
  <div id="crossStatsModal" class="modal hidden">
    <div class="modal-panel">
      <h2 class="modal-title">跨问卷统计</h2>
      <div id="crossStatsContent"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="closeCrossStats">关闭</button>
      </div>
    </div>
  </div>

  <script src="/js/question-lib.js"></script>
</body>
</html>
