<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问卷系统 - 题库管理</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="/dashboard.html" class="nav-brand">问卷系统</a>
    <div class="nav-actions">
      <a href="/dashboard.html" class="btn btn-outline btn-sm">问卷</a>
      <a href="/question-lib.html" class="btn btn-outline btn-sm">题目库</a>
      <a href="/question-bank.html" class="btn btn-primary btn-sm">题库</a>
      <span class="nav-user" id="navUser"></span>
      <button class="btn btn-outline btn-sm" id="logoutBtn">退出</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>题库管理</h1>
      <div class="header-actions">
        <button class="btn btn-primary" id="createBankBtn">+ 创建题库</button>
      </div>
    </div>

    <div id="alert"></div>
    <div id="bankList" class="stack"></div>
    <div id="emptyTip" class="card text-center text-secondary hidden">
      还没有题库，点击上方按钮创建一个吧。
    </div>
  </div>

  <!-- 创建题库弹窗 -->
  <div id="createBankModal" class="modal hidden">
    <div class="modal-panel">
      <h2 id="bankModalTitle" class="modal-title">创建题库</h2>
      <form id="bankForm">
        <div class="form-group">
          <label for="bankName">题库名称</label>
          <input type="text" id="bankName" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="bankDesc">题库说明</label>
          <textarea id="bankDesc" class="form-control"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelBank">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 题库详情弹窗 -->
  <div id="bankDetailModal" class="modal hidden">
    <div class="modal-panel">
      <h2 id="bankDetailTitle" class="modal-title">题库详情</h2>
      <div id="bankQuestionList" class="stack"></div>
      <div style="margin-top:1rem;">
        <h3 style="margin-bottom:8px;">添加题目到题库</h3>
        <div id="availableQuestions" class="stack"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="closeBankDetail">关闭</button>
      </div>
    </div>
  </div>

  <script src="/js/question-bank.js"></script>
</body>
</html>
